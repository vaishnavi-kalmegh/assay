name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify committed OpenAPI specification
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- specs/openapi.json
      - name: Run tests
        run: pytest
      - name: Generate and test acceptance suite
        run: assay acceptance
      - name: Compare baseline, criteria-driven and combined suites
        run: assay compare
      - name: Lint
        run: |
          ruff check .
          ruff check generated_acceptance
