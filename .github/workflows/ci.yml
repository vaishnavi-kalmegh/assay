name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify committed OpenAPI specification
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- specs/openapi.json
      - name: Run tests
        run: pytest
      - name: Generate and test acceptance suite
        run: assay acceptance
      - name: Lint
        run: ruff check .
