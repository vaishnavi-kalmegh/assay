[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assay"
version = "1.0.0"
description = "Offline-first OpenAPI test generation and requirement traceability"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vaishnavi Kalmegh" }]
keywords = ["openapi", "testing", "traceability", "mutation-testing", "pytest"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.5",
    "httpx==0.28.1",
    "PyYAML==6.0.2",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[project.urls]
Repository = "https://github.com/vaishnavi-kalmegh/assay"

[project.scripts]
assay = "assay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["req(requirement_id): acceptance requirement covered by a test"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
